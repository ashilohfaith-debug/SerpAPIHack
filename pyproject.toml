[project]
name = "relay"
version = "0.3.3"
description = "RELAY — Windows-first, offline-first, voice-first accessibility assistant for blind and visually impaired people."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
# Essential core is pure stdlib. Voice (P3) and perception (P4) deps are added
# behind extras once Windows/3.12 wheel compatibility is verified — the core
# never forces a heavy install.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "psutil>=5.9"]
# P3 offline voice (verified importing on Windows/CPython 3.12):
voice = [
    "numpy>=1.26",
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "faster-whisper>=1.0",   # chosen STT (tiny.en int8); whisper.cpp is a fallback
    "piper-tts>=1.8",        # preferred TTS; SAPI (pywin32) is the fallback
    "webrtcvad-wheels>=2.0", # VAD (no torch — kept light for the 4 GB target)
    "pywin32>=306",          # SAPI TTS + Win32
    "onnxruntime>=1.17",     # piper backend
]
# P4 perception (verified importing + real UIA read on Windows/CPython 3.12):
percept = [
    "uiautomation>=2.0",
    "comtypes>=1.2",
    "psutil>=5.9",              # foreground process -> app name
    "rapidocr-onnxruntime>=1.3",  # on-demand OCR fallback (last resort)
    "pillow>=10",
    "mss>=9",                  # screen capture for OCR
]
# Everyday skills (volume level, reading PDFs, typing/keys) — all permissive licences:
daily = [
    "pycaw>=20240316",         # exact master volume / mute via Core Audio (MIT)
    "pypdf>=4",                # read PDFs aloud (BSD-3)
    "pyperclip>=1.8",          # reliable text entry + "read the clipboard" (BSD-3)
]

[project.scripts]
relay = "relay.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["relay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: exercises real models/audio/OS (slower; needs voice deps installed)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle errors, pyflakes, import sorting. We deliberately keep broad
# defensive try/except in isolation boundaries (event bus, emergency flush,
# worker supervisor) so one bad callback can't break the others — so the
# opinionated BLE/S "blind except" rules are not part of this baseline.
select = ["E", "F", "I"]
