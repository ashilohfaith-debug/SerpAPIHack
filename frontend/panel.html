<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RELAY Panel</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #131a22; --line: #24303c; --fg: #e8eef5;
    --muted: #9fb0c0; --accent: #4ea1ff; --ok: #4bd07a; --warn: #ffcf5c;
    --err: #ff6b6b; --focus: #ffd166;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#f4f7fb; --panel:#fff; --line:#d6e0ea; --fg:#10202e; --muted:#4b5b6b;
      --accent:#0b62d6; --ok:#137a3a; --warn:#8a6100; --err:#b3261e; --focus:#0b62d6;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, "Segoe UI", Arial, sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:14px 16px;
           border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; }
  h1 { font-size:18px; margin:0; letter-spacing:.5px; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  .row { display:flex; flex-wrap:wrap; gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px;
          padding:14px 16px; flex:1 1 220px; }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:1px;
             color:var(--muted); margin:0 0 6px; }
  .big { font-size:22px; font-weight:600; }
  .chip { display:inline-block; padding:3px 10px; border-radius:999px;
          border:1px solid var(--line); font-size:14px; }
  .chip.speaking { color:var(--accent); border-color:var(--accent); }
  .chip.listening { color:var(--ok); border-color:var(--ok); }
  .chip.acting { color:var(--warn); border-color:var(--warn); }
  .chip.error { color:var(--err); border-color:var(--err); }
  #perm { border-color: var(--warn); }
  #perm:not(.active) { display:none; }
  .log { max-height: 42vh; overflow:auto; margin:0; padding:0; list-style:none; }
  .log li { padding:8px 10px; border-bottom:1px solid var(--line); }
  .log li:first-child { color: var(--fg); font-weight:600; }
  form { display:flex; gap:8px; margin-top:8px; }
  input[type=text] { flex:1; padding:10px 12px; border-radius:10px;
                     border:1px solid var(--line); background:var(--bg); color:var(--fg);
                     font-size:16px; }
  button { padding:10px 14px; border-radius:10px; border:1px solid var(--line);
           background:var(--panel); color:var(--fg); font-size:15px; cursor:pointer; }
  button:hover { border-color: var(--accent); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .modes { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .status-dot { width:10px; height:10px; border-radius:50%; background:var(--err); }
  .status-dot.on { background: var(--ok); }
  .muted { color: var(--muted); font-size:13px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <span class="status-dot" id="conn" aria-hidden="true"></span>
  <h1>RELAY</h1>
  <span class="muted" id="connText" role="status" aria-live="polite">connecting…</span>
</header>
<main>
  <p class="muted">This panel mirrors what RELAY is doing. It is optional — RELAY works
     entirely by voice, and closing this panel does not stop it.</p>

  <div class="row" aria-label="Live status">
    <div class="card"><h2>Voice</h2><span class="chip" id="voice">idle</span></div>
    <div class="card"><h2>Task</h2><span class="chip" id="task">—</span></div>
    <div class="card"><h2>Active app</h2><span class="big" id="app">—</span></div>
  </div>

  <div class="card" id="perm" role="alert" aria-live="assertive" aria-atomic="true">
    <h2>Confirmation needed</h2><div id="permText"></div>
  </div>

  <div class="card">
    <h2>What RELAY is saying</h2>
    <ul class="log" id="log" role="log" aria-live="polite" aria-relevant="additions"></ul>
  </div>

  <div class="card">
    <h2>Send a command</h2>
    <form id="cmdForm">
      <label for="cmd" class="muted" style="position:absolute;left:-9999px">Command</label>
      <input type="text" id="cmd" placeholder="e.g. what's on my screen" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
    <div class="modes" role="group" aria-label="Narration mode">
      <button data-mode="quick">Quick</button>
      <button data-mode="detailed">Detailed</button>
      <button data-mode="guided">Guided</button>
      <button data-mode="quiet">Quiet</button>
    </div>
  </div>
</main>
<script>
  const token = new URLSearchParams(location.search).get("token") || "";
  const $ = (id) => document.getElementById(id);
  const setConn = (on, text) => {
    $("conn").classList.toggle("on", on);
    $("connText").textContent = text;
  };
  const CHIP = { idle:"", listening:"listening", transcribing:"listening",
                 speaking:"speaking", acting:"acting", verifying:"acting",
                 planning:"acting", recovering:"acting", error:"error",
                 waiting_for_confirmation:"acting" };

  function addLog(text) {
    const ul = $("log");
    const li = document.createElement("li");
    li.textContent = text;
    ul.insertBefore(li, ul.firstChild);
    while (ul.children.length > 200) ul.removeChild(ul.lastChild);
  }
  function maybePermission(text) {
    const t = text.toLowerCase();
    if (t.includes("to confirm, say") || t.includes("can't be undone") ||
        t.includes("needs your confirmation")) {
      $("perm").classList.add("active");
      $("permText").textContent = text;
    }
    if (t.startsWith("confirmed") || t.startsWith("cancelled") || t.includes("won't do it")) {
      $("perm").classList.remove("active");
    }
  }

  const es = new EventSource("/events?token=" + encodeURIComponent(token));
  es.onopen = () => setConn(true, "connected");
  es.onerror = () => setConn(false, "disconnected — RELAY still runs by voice");
  es.onmessage = (e) => {
    let msg; try { msg = JSON.parse(e.data); } catch { return; }
    const d = msg.data || {};
    if (msg.type === "voice.state") {
      const s = d.to || "idle";
      const chip = $("voice"); chip.textContent = s; chip.className = "chip " + (CHIP[s] || "");
    } else if (msg.type === "task.state") {
      const s = d.to || "—";
      const chip = $("task"); chip.textContent = s; chip.className = "chip " + (CHIP[s] || "");
    } else if (msg.type === "perception.change") {
      if (d.foreground_app) $("app").textContent = d.foreground_app;
      if (d.summary) addLog("👁 " + d.summary);
    } else if (msg.type === "narration.say") {
      if (d.text) { addLog(d.text); maybePermission(d.text); }
    }
  };

  async function send(payload) {
    try {
      await fetch("/command?token=" + encodeURIComponent(token), {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
    } catch { /* core may be down; panel stays passive */ }
  }
  $("cmdForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = $("cmd").value.trim();
    if (v) { addLog("🗣 " + v); send({ command: "handle", text: v }); $("cmd").value = ""; }
  });
  document.querySelectorAll(".modes button").forEach((b) =>
    b.addEventListener("click", () => send({ command: "set_mode", mode: b.dataset.mode })));
</script>
</body>
</html>
